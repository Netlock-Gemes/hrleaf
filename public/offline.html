<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · HRLeaf</title>
<style>
  :root { color-scheme: dark light; --bg:#121110; --ink:#ece8e1; --muted:#a29d94; --leaf:#4cc47e; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f1ec; --ink:#211e1a; --muted:#5f5a52; --leaf:#17804a; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { min-height:100%; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
  .box { max-width:24rem; }
  svg { display:block; margin-bottom:24px; }
  h1 { font-size:22px; letter-spacing:-0.02em; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; font-size:13px; font-weight:600; border:0; border-radius:6px; padding:9px 14px; background:var(--ink); color:var(--bg); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--leaf); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div class="box">
    <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="cut"><path d="M50 4H96V50A46 46 0 0 1 50 96H4V50A46 46 0 0 1 50 4Z" fill="#fff"/><path d="M4 96 70 30" stroke="#000" stroke-width="9" stroke-linecap="round"/></mask></defs><rect width="100" height="100" style="fill:var(--leaf)" mask="url(#cut)"/></svg>
    <h1>You're offline</h1>
    <p>This note hasn't been opened on this device yet, so there's no copy to show. Notes you've opened before can still be read offline.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
